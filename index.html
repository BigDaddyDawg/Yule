<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Yule — people, ideas, purchases, and the Christmas budget." />
  <meta name="theme-color" content="#1c3a2c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Yule" />
  <title>Yule</title>
  <link rel="manifest" href="manifest.webmanifest?v=5" />
  <link rel="icon" href="icon.svg?v=5" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=5" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=5" />
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Christmas</p>
      <h1 class="brand">Yule</h1>
    </div>
    <p class="sync-pill" id="syncPill">Syncing…</p>
  </header>

  <main>
    <section id="budgetCard"></section>
    <div id="peopleList"></div>
    <p class="empty" id="peopleEmpty" hidden>No one yet. Add the first person.</p>
  </main>

  <button type="button" class="fab" id="addPersonBtn">Add person</button>

  <div class="sheet" id="personSheet" hidden>
    <div class="sheet-card">
      <button type="button" class="sheet-back" id="personBack">‹ Back</button>
      <div id="personBody"></div>
    </div>
  </div>

  <dialog class="modal" id="addModal">
    <form class="modal-card" id="addForm">
      <h2>Add someone</h2>
      <label>
        <span>Name</span>
        <input id="addName" type="text" required maxlength="80" placeholder="Who?" autocomplete="off" />
      </label>
      <label>
        <span>Side</span>
        <select id="addSide" required></select>
      </label>
      <div class="modal-actions">
        <button type="button" class="ghost" id="addCancel">Cancel</button>
        <button type="submit" class="primary">Add</button>
      </div>
    </form>
  </dialog>

  <dialog class="modal" id="budgetModal">
    <form class="modal-card" id="budgetForm">
      <h2>This year’s budget</h2>
      <label>
        <span>Budget</span>
        <input id="budgetInput" type="number" inputmode="decimal" min="0" step="0.01" required placeholder="£" />
      </label>
      <div class="modal-actions">
        <button type="button" class="ghost" id="budgetCancel">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="family-vault-config.js?v=5"></script>
  <script src="wrapnest-crypto.js?v=5"></script>
  <script src="wrapnest-sync.js?v=5"></script>
  <script src="app.js?v=5" defer></script>
</body>
</html>
